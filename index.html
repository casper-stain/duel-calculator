<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Рюкзак</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #111318;
  color: #ffffff;
  font-family: Arial, sans-serif;
}

body {
  padding: 16px;
}

.title {
  font-size: 26px;
  font-weight: 700;
  margin-bottom: 4px;
}

.subtitle {
  color: #8f96a3;
  font-size: 14px;
  margin-bottom: 18px;
}

.search-wrapper {
  position: relative;
  margin-bottom: 16px;
}

.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
  pointer-events: none;
}

.search {
  width: 100%;
  height: 46px;
  padding: 0 14px 0 44px;
  border: 1px solid #292e38;
  border-radius: 14px;
  outline: none;
  background: #1b1f27;
  color: #ffffff;
  font-size: 16px;
}

.search::placeholder {
  color: #737b89;
}

.search:focus {
  border-color: #4d5564;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.resource-card {
  min-width: 0;
  aspect-ratio: 1 / 1;
  padding: 12px;
  border-radius: 18px;
  background: #1b1f27;
  border: 1px solid #292e38;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;

  cursor: pointer;
  user-select: none;

  transition:
    transform 0.12s ease,
    background 0.12s ease;
}

.resource-card:active {
  transform: scale(0.96);
  background: #252a34;
}

.resource-icon {
  width: 76px;
  height: 76px;

  display: flex;
  align-items: center;
  justify-content: center;

  margin-bottom: 10px;

  font-size: 54px;
  line-height: 1;
}

.resource-icon img {
  width: 76px;
  height: 76px;

  object-fit: contain;

  display: block;
}

.resource-name {
  width: 100%;

  font-size: 13px;
  line-height: 17px;
  font-weight: 500;

  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;

  overflow: hidden;
}

.resource-amount {
  margin-top: 8px;

  font-size: 18px;
  line-height: 22px;
  font-weight: 700;
}

.empty {
  display: none;

  text-align: center;
  color: #737b89;

  padding: 30px 10px;
}

/* =========================
   ЗАГРУЗКА
   ========================= */

.loading {
  position: fixed;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #111318;
  color: #8f96a3;

  font-size: 15px;

  z-index: 1000;
}

/* =========================
   MODAL
   ========================= */

.modal-overlay {
  position: fixed;
  inset: 0;

  background: rgba(0, 0, 0, 0.65);

  display: flex;
  align-items: flex-end;
  justify-content: center;

  padding: 16px;

  opacity: 0;
  visibility: hidden;

  transition:
    opacity 0.2s ease,
    visibility 0.2s ease;

  z-index: 2000;
}

.modal-overlay.active {
  opacity: 1;
  visibility: visible;
}

.modal {
  width: 100%;
  max-width: 420px;

  background: #1b1f27;

  border: 1px solid #292e38;
  border-radius: 22px;

  padding: 22px;

  transform: translateY(30px);

  transition: transform 0.2s ease;
}

.modal-overlay.active .modal {
  transform: translateY(0);
}

.modal-icon {
  width: 80px;
  height: 80px;

  margin: 0 auto 12px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 54px;
}

.modal-icon img {
  width: 80px;
  height: 80px;

  object-fit: contain;

  display: block;
}

.modal-title {
  font-size: 19px;
  font-weight: 700;

  text-align: center;

  line-height: 24px;

  margin-bottom: 8px;
}

.modal-current {
  text-align: center;

  color: #8f96a3;

  font-size: 14px;

  margin-bottom: 16px;
}

.amount-input {
  width: 100%;
  height: 52px;

  padding: 0 16px;

  border: 1px solid #343a46;
  border-radius: 14px;

  outline: none;

  background: #111318;
  color: #ffffff;

  font-size: 20px;
  font-weight: 600;

  text-align: center;

  margin-bottom: 12px;
}

.amount-input:focus {
  border-color: #596273;
}

.modal-close {
  width: 100%;
  height: 48px;

  border: 0;
  border-radius: 14px;

  background: #292f3a;
  color: #ffffff;

  font-size: 16px;
  font-weight: 600;

  cursor: pointer;
}

.modal-close:active {
  background: #343b48;
}

/* =========================
   ДЛЯ БОЛЬШОГО ЭКРАНА
   ========================= */

@media (min-width: 600px) {

  body {
    max-width: 700px;
    margin: 0 auto;
  }

  .grid {
    grid-template-columns:
      repeat(3, minmax(0, 1fr));
  }

}

</style>

</head>

<body>

<div id="loading" class="loading">
  Загрузка рюкзака...
</div>

<div class="title">
  🎒 Рюкзак
</div>

<div class="subtitle">
  Управление ресурсами
</div>

<div class="search-wrapper">

  <span class="search-icon">🔎</span>

  <input
    id="search"
    class="search"
    type="text"
    placeholder="Поиск ресурса..."
    autocomplete="off"
    oninput="filterResources()"
  >

</div>

<div id="grid" class="grid"></div>

<div id="empty" class="empty">
  Ничего не найдено
</div>


<!-- =========================
     ОКНО РЕДАКТИРОВАНИЯ
     ========================= -->

<div
  id="modalOverlay"
  class="modal-overlay"
  onclick="closeModal(event)"
>

  <div
    class="modal"
    onclick="event.stopPropagation()"
  >

    <div
      id="modalIcon"
      class="modal-icon"
    >
      📦
    </div>

    <div
      id="modalTitle"
      class="modal-title"
    >
      Ресурс
    </div>

    <div
      id="modalCurrent"
      class="modal-current"
    >
      Текущее количество: 0
    </div>

    <input
      id="amountInput"
      class="amount-input"
      type="number"
      min="0"
      step="1"
      inputmode="numeric"
      autocomplete="off"
    >

    <button
      class="modal-close"
      onclick="closeModal()"
    >
      Закрыть
    </button>

  </div>

</div>


<script>

/* =========================
   GOOGLE APPS SCRIPT
   ========================= */

const API_URL =
  'https://script.google.com/macros/s/AKfycbzeyP7PEDkUcVy5nSBPN78UNhzqB9PShdKwWFG7F2QQo0EAO-AwrH1zKoNll7i_EBM/exec';


/* =========================
   РЕСУРСЫ
   ========================= */

const RESOURCES = [

  'Золото',

  'Карты героев SSR-ранга',

  'Самовыбор книг опыта бойца',

  'Самовыбор рун дракона',

  'Самовыбор строительства замка',

  'Идеальное заклинание призыва',

  'Продвинутое заклинание призыва',

  'Кровь титана',

  'Флакон стихий',

  'Зелье удачи',

  'Укрепляющее зелье',

  'Элитный камень души дракона',

  'Камень души дракона',

  'Камень',

  'Кузнечный молот',

  'Идеальное заклинание призыва (переработано)',

  'Продвинутое заклинание призыва (переработано)',

  'Элитный камень души дракона (переработано)',

  'Камень души дракона (переработано)',

  'Кровь титана (переработано)',

  'Флакон стихий (переработано)',

  'Дерево',

  'Сталь',

  'Книга опыта лучниц 1-го ранга',
  'Книга опыта лучниц 2-го ранга',
  'Книга опыта лучниц 3-го ранга',
  'Книга опыта лучниц 4-го ранга',

  'Книга опыта огненных магов 1-го ранга',
  'Книга опыта огненных магов 2-го ранга',
  'Книга опыта огненных магов 3-го ранга',
  'Книга опыта огненных магов 4-го ранга',

  'Книга опыта ледяных колдуний 1-го ранга',
  'Книга опыта ледяных колдуний 2-го ранга',
  'Книга опыта ледяных колдуний 3-го ранга',
  'Книга опыта ледяных колдуний 4-го ранга',

  'Книга опыта гоблинов 1-го ранга',
  'Книга опыта гоблинов 2-го ранга',
  'Книга опыта гоблинов 3-го ранга',
  'Книга опыта гоблинов 4-го ранга',

  'Эпическая руна дракона',
  'Идеальная руна дракона',
  'Отличная руна дракона',
  'Редкая руна дракона',

  'Книга Мастера Таланты',
  'Корона оракула',
  'Осколок галереи',
  'Реагент света'

];


/* =========================
   ИКОНКИ ИЗ GITHUB
   ========================= */

const ICONS = {

  'Золото':
    'https://raw.githubusercontent.com/casper-stain/duel-calculator/main/icons/gold.DeetlnD8.webp',

  'Карты героев SSR-ранга':
    'https://raw.githubusercontent.com/casper-stain/duel-calculator/main/icons/goldCard.DlXm9u8o.webp',

  'Самовыбор рун дракона':
    'https://raw.githubusercontent.com/casper-stain/duel-calculator/main/icons/box.DSyalO63.webp',

  'Самовыбор книг опыта бойца':
    'https://raw.githubusercontent.com/casper-stain/duel-calculator/main/icons/random.k7T6jTqQ.webp'

};


/* =========================
   ОСТАЛЬНЫЕ EMOJI
   ========================= */

const EMOJI = {

  'Самовыбор строительства замка': '🏰',

  'Идеальное заклинание призыва': '✨',

  'Продвинутое заклинание призыва': '⭐',

  'Кровь титана': '🩸',

  'Флакон стихий': '🧪',

  'Зелье удачи': '🍀',

  'Укрепляющее зелье': '💪',

  'Элитный камень души дракона': '💎',

  'Камень души дракона': '🔷',

  'Камень': '🪨',

  'Кузнечный молот': '🔨',

  'Дерево': '🌲',

  'Сталь': '⚙️',

  'Книга опыта лучниц 1-го ранга': '📕',
  'Книга опыта лучниц 2-го ранга': '📗',
  'Книга опыта лучниц 3-го ранга': '📘',
  'Книга опыта лучниц 4-го ранга': '📙',

  'Книга опыта огненных магов 1-го ранга': '🔥',
  'Книга опыта огненных магов 2-го ранга': '🔥',
  'Книга опыта огненных магов 3-го ранга': '🔥',
  'Книга опыта огненных магов 4-го ранга': '🔥',

  'Книга опыта ледяных колдуний 1-го ранга': '❄️',
  'Книга опыта ледяных колдуний 2-го ранга': '❄️',
  'Книга опыта ледяных колдуний 3-го ранга': '❄️',
  'Книга опыта ледяных колдуний 4-го ранга': '❄️',

  'Книга опыта гоблинов 1-го ранга': '👺',
  'Книга опыта гоблинов 2-го ранга': '👺',
  'Книга опыта гоблинов 3-го ранга': '👺',
  'Книга опыта гоблинов 4-го ранга': '👺',

  'Эпическая руна дракона': '🟣',
  'Идеальная руна дракона': '🔵',
  'Отличная руна дракона': '🟢',
  'Редкая руна дракона': '⚪',

  'Книга Мастера Таланты': '📖',

  'Корона оракула': '👑',

  'Осколок галереи': '💠',

  'Реагент света': '☀️'

};


/* =========================
   ДАННЫЕ
   ========================= */

let backpack = {};

let currentResource = null;


/* =========================
   ЗАГРУЗКА РЮКЗАКА
   ========================= */

function loadBackpack() {

  const token =
    new URLSearchParams(
      window.location.search
    ).get('token');

  if (!token) {

    document.getElementById(
      'loading'
    ).textContent =
      'Не найден ключ доступа.';

    return;

  }

  fetch(
    API_URL +
    '?action=getBackpack&token=' +
    encodeURIComponent(token)
  )

    .then(function(response) {

      return response.json();

    })

    .then(function(data) {

      if (data.error) {

        throw new Error(data.error);

      }

      backpack = data;

      document.getElementById(
        'loading'
      ).style.display = 'none';

      renderResources();

    })

    .catch(function(error) {

      document.getElementById(
        'loading'
      ).textContent =
        'Ошибка загрузки: ' +
        error.message;

    });

}


/* =========================
   ПОЛУЧИТЬ ИКОНКУ
   ========================= */

function getIcon(resource) {

  if (ICONS[resource]) {

    return `
      <img
        src="${ICONS[resource]}"
        alt=""
      >
    `;

  }

  return (
    EMOJI[resource] ||
    '📦'
  );

}


/* =========================
   ОТРИСОВКА ПЛИТОК
   ========================= */

function renderResources(list) {

  const grid =
    document.getElementById('grid');

  const empty =
    document.getElementById('empty');

  const resources =
    list || RESOURCES;

  grid.innerHTML = '';

  if (resources.length === 0) {

    empty.style.display = 'block';

    return;

  }

  empty.style.display = 'none';

  resources.forEach(
    function(resource) {

      const card =
        document.createElement('div');

      card.className =
        'resource-card';

      const amount =
        backpack[resource] || 0;

      card.innerHTML = `

        <div class="resource-icon">
          ${getIcon(resource)}
        </div>

        <div class="resource-name">
          ${escapeHtml(resource)}
        </div>

        <div class="resource-amount">
          ${formatNumber(amount)}
        </div>

      `;

      card.addEventListener(
        'click',
        function() {

          openResource(resource);

        }
      );

      grid.appendChild(card);

    }
  );

}


/* =========================
   ПОИСК
   ========================= */

function filterResources() {

  const query =
    document
      .getElementById('search')
      .value
      .trim()
      .toLowerCase();

  if (!query) {

    renderResources();

    return;

  }

  const filtered =
    RESOURCES.filter(
      function(resource) {

        return resource
          .toLowerCase()
          .includes(query);

      }
    );

  renderResources(filtered);

}


/* =========================
   ОТКРЫТЬ РЕСУРС
   ========================= */

function openResource(resource) {

  currentResource =
    resource;

  const amount =
    backpack[resource] || 0;

  const modalIcon =
    document.getElementById(
      'modalIcon'
    );

  if (ICONS[resource]) {

    modalIcon.innerHTML = `
      <img
        src="${ICONS[resource]}"
        alt=""
      >
    `;

  } else {

    modalIcon.textContent =
      EMOJI[resource] ||
      '📦';

  }

  document.getElementById(
    'modalTitle'
  ).textContent =
    resource;

  document.getElementById(
    'modalCurrent'
  ).textContent =
    'Текущее количество: ' +
    formatNumber(amount);

  const input =
    document.getElementById(
      'amountInput'
    );

  input.value =
    amount;

  document
    .getElementById('modalOverlay')
    .classList
    .add('active');

  setTimeout(
    function() {

      input.focus();
      input.select();

    },
    100
  );

}


/* =========================
   АВТОСОХРАНЕНИЕ
   ========================= */

document
  .getElementById('amountInput')
  .addEventListener(
    'change',
    function() {

      saveCurrentResource();

    }
  );


document
  .getElementById('amountInput')
  .addEventListener(
    'keydown',
    function(event) {

      if (event.key === 'Enter') {

        event.preventDefault();

        saveCurrentResource();

        closeModal();

      }

    }
  );


function saveCurrentResource() {

  if (!currentResource) {

    return;

  }

  const input =
    document.getElementById(
      'amountInput'
    );

  let value =
    Number(input.value);

  if (
    !Number.isInteger(value) ||
    value < 0
  ) {

    value = 0;

    input.value = 0;

  }

  backpack[currentResource] =
    value;

  renderResources();

  const token =
    new URLSearchParams(
      window.location.search
    ).get('token');

  if (!token) {

    return;

  }

  fetch(
    API_URL +
    '?action=saveResource' +
    '&token=' +
    encodeURIComponent(token) +
    '&resource=' +
    encodeURIComponent(currentResource) +
    '&amount=' +
    encodeURIComponent(value)
  )

    .then(function(response) {

      return response.json();

    })

    .then(function(data) {

      if (data.error) {

        console.error(
          data.error
        );

      }

    })

    .catch(function(error) {

      console.error(
        'Ошибка сохранения:',
        error
      );

    });

}


/* =========================
   ЗАКРЫТЬ ОКНО
   ========================= */

function closeModal(event) {

  if (
    event &&
    event.target !==
      document.getElementById(
        'modalOverlay'
      )
  ) {

    return;

  }

  document
    .getElementById(
      'modalOverlay'
    )
    .classList
    .remove('active');

  currentResource =
    null;

}


/* =========================
   ФОРМАТ ЧИСЕЛ
   ========================= */

function formatNumber(number) {

  return Number(number)
    .toLocaleString('ru-RU');

}


/* =========================
   БЕЗОПАСНЫЙ ТЕКСТ
   ========================= */

function escapeHtml(text) {

  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


/* =========================
   ЗАПУСК
   ========================= */

loadBackpack();

</script>

</body>
</html>
