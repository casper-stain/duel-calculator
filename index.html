<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>🎒 Рюкзак</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #111827;
  color: #fff;
  font-family: Arial, sans-serif;
}

body {
  padding: 16px 12px 30px;
}

.title {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 4px;
}

.subtitle {
  font-size: 14px;
  color: #9ca3af;
  margin-bottom: 14px;
}

.search-wrapper {
  position: relative;
  width: 100%;
  margin-bottom: 12px;
}

.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 17px;
  pointer-events: none;
}

.search {
  width: 100%;
  height: 42px;
  padding: 0 12px 0 40px;
  border: 1px solid #374151;
  border-radius: 12px;
  background: #1f2937;
  color: #fff;
  font-size: 15px;
  outline: none;
}

.search::placeholder {
  color: #9ca3af;
}

#grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  width: 100%;
}

.resource-card {
  width: 100%;
  min-width: 0;
  min-height: 126px;
  padding: 9px 6px;
  background: #1f2937;
  border: 1px solid #374151;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.1s ease, background 0.1s ease;
}

.resource-card:active {
  transform: scale(0.96);
  background: #293548;
}

.resource-icon {
  width: 56px;
  height: 56px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  line-height: 1;
  overflow: hidden;
  flex-shrink: 0;
}

.resource-icon img {
  width: 56px;
  height: 56px;
  object-fit: contain;
  display: block;
}

.resource-name {
  width: 100%;
  min-height: 40px;
  text-align: center;
  font-size: 11px;
  line-height: 1.2;
  color: #f3f4f6;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  word-break: break-word;
}

.resource-amount {
  margin-top: 5px;
  font-size: 14px;
  font-weight: 700;
  color: #fff;
}

#loading {
  text-align: center;
  padding: 50px 20px;
  color: #9ca3af;
  font-size: 15px;
}

#empty {
  display: none;
  text-align: center;
  padding: 40px 20px;
  color: #9ca3af;
}

#modalOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.15s ease, visibility 0.15s ease;
  z-index: 1000;
}

#modalOverlay.active {
  opacity: 1;
  visibility: visible;
}

.modal {
  width: 100%;
  max-width: 340px;
  background: #1f2937;
  border: 1px solid #374151;
  border-radius: 18px;
  padding: 20px;
  text-align: center;
}

.modal-icon {
  width: 64px;
  height: 64px;
  margin: 0 auto 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 46px;
  overflow: hidden;
}

.modal-icon img {
  width: 64px;
  height: 64px;
  object-fit: contain;
  display: block;
}

.modal-title {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.25;
  margin-bottom: 8px;
}

.modal-current {
  font-size: 13px;
  color: #9ca3af;
  margin-bottom: 14px;
}

.amount-input {
  width: 100%;
  height: 48px;
  padding: 0 12px;
  border: 1px solid #4b5563;
  border-radius: 10px;
  background: #111827;
  color: #fff;
  font-size: 18px;
  text-align: center;
  outline: none;
}

.amount-input:focus {
  border-color: #9ca3af;
}

.modal-close {
  width: 100%;
  height: 44px;
  margin-top: 12px;
  border: 0;
  border-radius: 10px;
  background: #374151;
  color: #fff;
  font-size: 15px;
}

.modal-close:active {
  background: #4b5563;
}

@media (max-width: 340px) {
  #grid {
    gap: 6px;
  }

  .resource-card {
    min-height: 118px;
    padding: 7px 4px;
  }

  .resource-icon,
  .resource-icon img {
    width: 50px;
    height: 50px;
  }

  .resource-name {
    font-size: 10px;
  }

  .resource-amount {
    font-size: 13px;
  }
}
</style>
</head>

<body>

<div class="title">🎒 Рюкзак</div>

<div class="subtitle">Управление ресурсами</div>

<div class="search-wrapper">
  <span class="search-icon">🔎</span>
  <input
    id="search"
    class="search"
    type="text"
    placeholder="Поиск ресурса..."
    autocomplete="off"
    oninput="filterResources()"
  >
</div>

<div id="loading">Загрузка...</div>

<div id="grid"></div>

<div id="empty">Ничего не найдено</div>

<div id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">

    <div id="modalIcon" class="modal-icon">📦</div>

    <div id="modalTitle" class="modal-title">
      Ресурс
    </div>

    <div id="modalCurrent" class="modal-current">
      Текущее количество: 0
    </div>

    <input
      id="amountInput"
      class="amount-input"
      type="number"
      min="0"
      step="1"
      inputmode="numeric"
      autocomplete="off"
    >

    <button
      class="modal-close"
      onclick="closeModal()"
    >
      Закрыть
    </button>

  </div>
</div>

<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbzeyP7PEDkUcVy5nSBPN78UNhzqB9PShdKwWFG7F2QQo0EAO-AwrH1zKoNll7i_EBM/exec';


const RESOURCES = [
  'Золото',
  'Карты героев SSR-ранга',
  'Самовыбор книг опыта бойца',
  'Самовыбор рун дракона',
  'Самовыбор строительства замка',
  'Идеальное заклинание призыва',
  'Продвинутое заклинание призыва',
  'Кровь титана',
  'Флакон стихий',
  'Зелье удачи',
  'Укрепляющее зелье',
  'Элитный камень души дракона',
  'Камень души дракона',
  'Камень',
  'Кузнечный молот',

  'Идеальное заклинание призыва (переработано)',
  'Продвинутое заклинание призыва (переработано)',
  'Элитный камень души дракона (переработано)',
  'Камень души дракона (переработано)',
  'Кровь титана (переработано)',
  'Флакон стихий (переработано)',

  'Дерево',
  'Сталь',

  'Книга опыта лучниц 1-го ранга',
  'Книга опыта лучниц 2-го ранга',
  'Книга опыта лучниц 3-го ранга',
  'Книга опыта лучниц 4-го ранга',

  'Книга опыта огненных магов 1-го ранга',
  'Книга опыта огненных магов 2-го ранга',
  'Книга опыта огненных магов 3-го ранга',
  'Книга опыта огненных магов 4-го ранга',

  'Книга опыта ледяных колдуний 1-го ранга',
  'Книга опыта ледяных колдуний 2-го ранга',
  'Книга опыта ледяных колдуний 3-го ранга',
  'Книга опыта ледяных колдуний 4-го ранга',

  'Книга опыта гоблинов 1-го ранга',
  'Книга опыта гоблинов 2-го ранга',
  'Книга опыта гоблинов 3-го ранга',
  'Книга опыта гоблинов 4-го ранга',

  'Эпическая руна дракона',
  'Идеальная руна дракона',
  'Отличная руна дракона',
  'Редкая руна дракона',

  'Книга Мастера Таланты',
  'Корона оракула',
  'Осколок галереи',
  'Реагент света'
];


const ICONS = {

  'Золото':
    'https://raw.githubusercontent.com/casper-stain/duel-calculator/main/icons/gold.DeetlnD8.webp',

  'Карты героев SSR-ранга':
    'https://raw.githubusercontent.com/casper-stain/duel-calculator/main/icons/goldCard.DlXm9u8o.webp',

  'Самовыбор рун дракона':
    'https://raw.githubusercontent.com/casper-stain/duel-calculator/main/icons/box.DSyalO63.webp',

  'Самовыбор книг опыта бойца':
    'https://raw.githubusercontent.com/casper-stain/duel-calculator/main/icons/random.k7T6jTqQ.webp'

};


const EMOJI = {

  'Самовыбор строительства замка': '🏰',
  'Идеальное заклинание призыва': '✨',
  'Продвинутое заклинание призыва': '⭐',
  'Кровь титана': '🩸',
  'Флакон стихий': '🧪',
  'Зелье удачи': '🍀',
  'Укрепляющее зелье': '💪',
  'Элитный камень души дракона': '💎',
  'Камень души дракона': '🔷',
  'Камень': '🪨',
  'Кузнечный молот': '🔨',

  'Идеальное заклинание призыва (переработано)': '✨',
  'Продвинутое заклинание призыва (переработано)': '⭐',
  'Элитный камень души дракона (переработано)': '💎',
  'Камень души дракона (переработано)': '🔷',
  'Кровь титана (переработано)': '🩸',
  'Флакон стихий (переработано)': '🧪',

  'Дерево': '🌲',
  'Сталь': '⚙️',

  'Книга опыта лучниц 1-го ранга': '📕',
  'Книга опыта лучниц 2-го ранга': '📗',
  'Книга опыта лучниц 3-го ранга': '📘',
  'Книга опыта лучниц 4-го ранга': '📙',

  'Книга опыта огненных магов 1-го ранга': '🔥',
  'Книга опыта огненных магов 2-го ранга': '🔥',
  'Книга опыта огненных магов 3-го ранга': '🔥',
  'Книга опыта огненных магов 4-го ранга': '🔥',

  'Книга опыта ледяных колдуний 1-го ранга': '❄️',
  'Книга опыта ледяных колдуний 2-го ранга': '❄️',
  'Книга опыта ледяных колдуний 3-го ранга': '❄️',
  'Книга опыта ледяных колдуний 4-го ранга': '❄️',

  'Книга опыта гоблинов 1-го ранга': '👺',
  'Книга опыта гоблинов 2-го ранга': '👺',
  'Книга опыта гоблинов 3-го ранга': '👺',
  'Книга опыта гоблинов 4-го ранга': '👺',

  'Эпическая руна дракона': '🟣',
  'Идеальная руна дракона': '🔵',
  'Отличная руна дракона': '🟢',
  'Редкая руна дракона': '⚪',

  'Книга Мастера Таланты': '📖',
  'Корона оракула': '👑',
  'Осколок галереи': '💠',
  'Реагент света': '☀️'

};


let backpack = {};
let currentResource = null;


function loadBackpack() {

  const token =
    new URLSearchParams(
      window.location.search
    ).get('token');

  if (!token) {

    document.getElementById('loading').textContent =
      'Не найден ключ доступа.';

    return;
  }

  fetch(
    API_URL +
    '?action=getBackpack&token=' +
    encodeURIComponent(token)
  )

  .then(function(response) {
    return response.json();
  })

  .then(function(data) {

    if (data.error) {
      throw new Error(data.error);
    }

    backpack = data;

    document.getElementById('loading').style.display =
      'none';

    renderResources();

  })

  .catch(function(error) {

    document.getElementById('loading').textContent =
      'Ошибка загрузки: ' + error.message;

  });

}


function getIcon(resource) {

  if (ICONS[resource]) {

    return (
      '<img src="' +
      ICONS[resource] +
      '" alt="">'
    );

  }

  return EMOJI[resource] || '📦';

}


function renderResources(list) {

  const grid =
    document.getElementById('grid');

  const empty =
    document.getElementById('empty');

  const resources =
    list || RESOURCES;

  grid.innerHTML = '';

  if (resources.length === 0) {

    empty.style.display = 'block';

    return;
  }

  empty.style.display = 'none';

  resources.forEach(function(resource) {

    const card =
      document.createElement('div');

    card.className =
      'resource-card';

    const amount =
      backpack[resource] || 0;

    card.innerHTML =

      '<div class="resource-icon">' +
        getIcon(resource) +
      '</div>' +

      '<div class="resource-name">' +
        escapeHtml(resource) +
      '</div>' +

      '<div class="resource-amount">' +
        formatNumber(amount) +
      '</div>';

    card.addEventListener(
      'click',
      function() {
        openResource(resource);
      }
    );

    grid.appendChild(card);

  });

}


function filterResources() {

  const query =
    document
      .getElementById('search')
      .value
      .trim()
      .toLowerCase();

  if (!query) {

    renderResources();

    return;
  }

  const filtered =
    RESOURCES.filter(function(resource) {

      return resource
        .toLowerCase()
        .includes(query);

    });

  renderResources(filtered);

}


function openResource(resource) {

  currentResource =
    resource;

  const amount =
    backpack[resource] || 0;

  const modalIcon =
    document.getElementById('modalIcon');

  const image =
    ICONS[resource];

  if (image) {

    modalIcon.innerHTML =
      '<img src="' +
      image +
      '" alt="">';

  } else {

    modalIcon.textContent =
      EMOJI[resource] || '📦';

  }

  document.getElementById('modalTitle').textContent =
    resource;

  document.getElementById('modalCurrent').textContent =
    'Текущее количество: ' +
    formatNumber(amount);

  const input =
    document.getElementById('amountInput');

  input.value =
    amount;

  document
    .getElementById('modalOverlay')
    .classList
    .add('active');

  setTimeout(function() {

    input.focus();
    input.select();

  }, 100);

}


document
  .getElementById('amountInput')
  .addEventListener(
    'change',
    function() {
      saveCurrentResource();
    }
  );


document
  .getElementById('amountInput')
  .addEventListener(
    'keydown',
    function(event) {

      if (event.key === 'Enter') {

        event.preventDefault();

        saveCurrentResource();

        closeModal();

      }

    }
  );


function saveCurrentResource() {

  if (!currentResource) {
    return;
  }

  const input =
    document.getElementById('amountInput');

  let value =
    Number(input.value);

  if (
    !Number.isInteger(value) ||
    value < 0
  ) {

    value = 0;
    input.value = 0;

  }

  backpack[currentResource] =
    value;

  renderResources();

  const token =
    new URLSearchParams(
      window.location.search
    ).get('token');

  if (!token) {
    return;
  }

  fetch(
    API_URL +
    '?action=saveResource' +
    '&token=' +
    encodeURIComponent(token) +
    '&resource=' +
    encodeURIComponent(currentResource) +
    '&amount=' +
    encodeURIComponent(value)
  )

  .then(function(response) {
    return response.json();
  })

  .then(function(data) {

    if (data.error) {
      console.error(data.error);
    }

  })

  .catch(function(error) {

    console.error(
      'Ошибка сохранения:',
      error
    );

  });

}


function closeModal(event) {

  if (
    event &&
    event.target !==
      document.getElementById('modalOverlay')
  ) {
    return;
  }

  document
    .getElementById('modalOverlay')
    .classList
    .remove('active');

  currentResource =
    null;

}


function formatNumber(number) {

  return Number(number)
    .toLocaleString('ru-RU');

}


function escapeHtml(text) {

  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


loadBackpack();

</script>

</body>
</html>
