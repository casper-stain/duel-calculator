<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Рюкзак</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: var(--tg-theme-bg-color, #17212b);
      --card: var(--tg-theme-secondary-bg-color, #202b36);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #8a9ba8);
      --border: var(--tg-theme-section-separator-color, #33404c);
      --button: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    body {
      padding: 12px;
      padding-bottom: 20px;
    }

    .app {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    .header {
      padding: 8px 4px 16px;
    }

    .header-title {
      font-size: 25px;
      font-weight: 700;
    }

    .header-subtitle {
      margin-top: 4px;
      color: var(--hint);
      font-size: 14px;
    }

    .resources {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .resource {
      background: var(--card);
      border-radius: 14px;
      padding: 12px;
      min-width: 0;
    }

    .resource-icon {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      background: rgba(128, 128, 128, 0.15);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 28px;
      margin-bottom: 9px;
    }

    .resource-name {
      font-size: 14px;
      line-height: 18px;
      min-height: 36px;
      font-weight: 600;
      word-break: break-word;
    }

    .resource-current {
      margin-top: 5px;
      color: var(--hint);
      font-size: 13px;
      line-height: 18px;
    }

    .resource-input {
      width: 100%;
      height: 38px;

      margin-top: 9px;
      padding: 0 9px;

      border: 1px solid var(--border);
      border-radius: 9px;

      outline: none;

      background: var(--bg);
      color: var(--text);

      font-size: 16px;
      text-align: center;
    }

    .resource-input:focus {
      border-color: var(--button);
    }

    .saving {
      position: fixed;

      left: 50%;
      bottom: 18px;

      transform: translateX(-50%);

      background: var(--card);
      color: var(--text);

      border: 1px solid var(--border);
      border-radius: 20px;

      padding: 8px 14px;

      font-size: 13px;

      opacity: 0;
      pointer-events: none;

      transition: opacity 0.2s ease;

      z-index: 1000;
    }

    .saving.show {
      opacity: 1;
    }

    .loading {
      text-align: center;
      color: var(--hint);
      padding: 40px 10px;
    }

    @media (max-width: 380px) {
      .resources {
        gap: 8px;
      }

      .resource {
        padding: 10px;
      }

      .resource-name {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="header-title">🎒 Рюкзак</div>
    <div class="header-subtitle">
      Изменения сохраняются автоматически
    </div>
  </div>

  <div id="resources" class="resources">
    <div class="loading">
      Загрузка рюкзака...
    </div>
  </div>

</div>

<div id="saving" class="saving">
  ✓ Сохранено
</div>

<script>

  /* =========================================================
     TELEGRAM
  ========================================================= */

  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();


  /* =========================================================
     НАСТРОЙКИ
  ========================================================= */

  const API_URL =
    'https://script.google.com/macros/s/AKfycbzeyP7PEDkUcVy5nSBPN78UNhzqB9PShdKwWFG7F2QQo0EAO-AwrH1zKoNll7i_EBM/exec';


  /* =========================================================
     РЕСУРСЫ
  ========================================================= */

  const RESOURCES = [
    'Золото',
    'Карты героев SSR-ранга',
    'Самовыбор книг опыта бойца',
    'Самовыбор рун дракона',
    'Самовыбор строительства замка',
    'Идеальное заклинание призыва',
    'Продвинутое заклинание призыва',
    'Кровь титана',
    'Флакон стихий',
    'Зелье удачи',
    'Укрепляющее зелье',
    'Элитный камень души дракона',
    'Камень души дракона',
    'Камень',
    'Кузнечный молот',
    'Идеальное заклинание призыва (переработано)',
    'Продвинутое заклинание призыва (переработано)',
    'Элитный камень души дракона (переработано)',
    'Камень души дракона (переработано)',
    'Кровь титана (переработано)',
    'Флакон стихий (переработано)',
    'Дерево',
    'Сталь',

    'Книга опыта лучниц 1-го ранга',
    'Книга опыта лучниц 2-го ранга',
    'Книга опыта лучниц 3-го ранга',
    'Книга опыта лучниц 4-го ранга',

    'Книга опыта огненных магов 1-го ранга',
    'Книга опыта огненных магов 2-го ранга',
    'Книга опыта огненных магов 3-го ранга',
    'Книга опыта огненных магов 4-го ранга',

    'Книга опыта ледяных колдуний 1-го ранга',
    'Книга опыта ледяных колдуний 2-го ранга',
    'Книга опыта ледяных колдуний 3-го ранга',
    'Книга опыта ледяных колдуний 4-го ранга',

    'Книга опыта гоблинов 1-го ранга',
    'Книга опыта гоблинов 2-го ранга',
    'Книга опыта гоблинов 3-го ранга',
    'Книга опыта гоблинов 4-го ранга',

    'Эпическая руна дракона',
    'Идеальная руна дракона',
    'Отличная руна дракона',
    'Редкая руна дракона',

    'Книга Мастера Таланты',
    'Корона оракула',
    'Осколок галереи',
    'Реагент света'
  ];


  /* =========================================================
     ИКОНКИ
  ========================================================= */

  const ICONS = [
    '🪙',
    '🃏',
    '📚',
    '🔮',
    '🏰',
    '✨',
    '💫',
    '🩸',
    '🧪',
    '🍀',
    '🧴',
    '💎',
    '💠',
    '🪨',
    '🔨',
    '✨',
    '💫',
    '💎',
    '💠',
    '🩸',
    '🧪',
    '🪵',
    '⚙️',

    '📘',
    '📗',
    '📙',
    '📕',

    '🔥',
    '🔥',
    '🔥',
    '🔥',

    '❄️',
    '❄️',
    '❄️',
    '❄️',

    '👺',
    '👺',
    '👺',
    '👺',

    '🔵',
    '🟣',
    '🟢',
    '⚪',

    '📖',
    '👑',
    '🖼️',
    '☀️'
  ];


  /* =========================================================
     TOKEN
  ========================================================= */

  const urlParams = new URLSearchParams(
    window.location.search
  );

  const token =
    urlParams.get('token') || '';


  /* =========================================================
     СОХРАНЕНИЕ УВЕДОМЛЕНИЯ
  ========================================================= */

  let savingTimer = null;

  function showSaved() {

    const element =
      document.getElementById('saving');

    element.classList.add('show');

    clearTimeout(savingTimer);

    savingTimer =
      setTimeout(function () {

        element.classList.remove('show');

      }, 1000);
  }


  /* =========================================================
     JSONP
  ========================================================= */

  let callbackCounter = 0;

  function jsonp(url) {

    return new Promise(function(resolve, reject) {

      const callbackName =
        'telegramMiniAppCallback_' +
        Date.now() +
        '_' +
        callbackCounter++;

      const script =
        document.createElement('script');

      const timeout =
        setTimeout(function() {

          cleanup();

          reject(
            new Error('Превышено время ожидания')
          );

        }, 15000);


      function cleanup() {

        clearTimeout(timeout);

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        delete window[callbackName];
      }


      window[callbackName] =
        function(data) {

          cleanup();

          resolve(data);
        };


      script.onerror =
        function() {

          cleanup();

          reject(
            new Error('Ошибка подключения')
          );

        };


      script.src =
        url +
        '&callback=' +
        encodeURIComponent(callbackName);

      document.body.appendChild(script);

    });
  }


  /* =========================================================
     ЗАГРУЗКА РЮКЗАКА
  ========================================================= */

  async function loadBackpack() {

    const container =
      document.getElementById('resources');

    if (!token) {

      container.innerHTML =
        '<div class="loading">' +
        'Не найден ключ доступа.<br>' +
        'Открой рюкзак через кнопку в боте.' +
        '</div>';

      return;
    }


    try {

      const url =
        API_URL +
        '?action=getBackpack' +
        '&token=' +
        encodeURIComponent(token);

      const data =
        await jsonp(url);

      if (!data.success) {
        throw new Error(
          data.error || 'Ошибка загрузки'
        );
      }

      renderResources(data.backpack);

    } catch (error) {

      console.error(error);

      container.innerHTML =
        '<div class="loading">' +
        'Не удалось загрузить рюкзак.<br><br>' +
        'Открой его заново через бота.' +
        '</div>';
    }
  }


  /* =========================================================
     ОТРИСОВКА
  ========================================================= */

  function renderResources(backpack) {

    const container =
      document.getElementById('resources');

    container.innerHTML = '';


    RESOURCES.forEach(
      function(resource, index) {

        const value =
          backpack[resource] || 0;


        const card =
          document.createElement('div');

        card.className =
          'resource';


        const icon =
          document.createElement('div');

        icon.className =
          'resource-icon';

        icon.textContent =
          ICONS[index] || '📦';


        const name =
          document.createElement('div');

        name.className =
          'resource-name';

        name.textContent =
          resource;


        const current =
          document.createElement('div');

        current.className =
          'resource-current';

        current.textContent =
          'Сейчас: ' + value;


        const input =
          document.createElement('input');

        input.className =
          'resource-input';

        input.type =
          'number';

        input.min =
          '0';

        input.step =
          '1';

        input.value =
          value;


        let saveTimer = null;


        input.addEventListener(
          'input',
          function() {

            current.textContent =
              'Сейчас: ' + input.value;


            clearTimeout(saveTimer);


            saveTimer =
              setTimeout(
                function() {

                  saveResource(
                    resource,
                    input.value,
                    current
                  );

                },
                500
              );

          }
        );


        card.appendChild(icon);
        card.appendChild(name);
        card.appendChild(current);
        card.appendChild(input);

        container.appendChild(card);

      }
    );
  }


  /* =========================================================
     СОХРАНЕНИЕ РЕСУРСА
  ========================================================= */

  async function saveResource(
    resource,
    amount,
    currentElement
  ) {

    if (!token) {
      return;
    }


    const number =
      Number(amount);


    if (
      !Number.isInteger(number) ||
      number < 0
    ) {
      return;
    }


    try {

      const url =
        API_URL +
        '?action=saveResource' +
        '&token=' +
        encodeURIComponent(token) +
        '&resource=' +
        encodeURIComponent(resource) +
        '&amount=' +
        encodeURIComponent(number);


      const result =
        await jsonp(url);


      if (!result.success) {
        throw new Error(
          result.error || 'Ошибка сохранения'
        );
      }


      currentElement.textContent =
        'Сейчас: ' + number;


      showSaved();


    } catch (error) {

      console.error(error);

      currentElement.textContent =
        'Ошибка сохранения';
    }
  }


  /* =========================================================
     ЗАПУСК
  ========================================================= */

  loadBackpack();

</script>

</body>
</html>
