  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      color-scheme: light dark;

    body {

        -apple-system,

        sans-serif;

      background: var(--tg-theme-bg-color, #ffffff);

      justify-content: center;

      font-size: 28px;

      margin-bottom: 8px;

      flex-shrink: 0;
    }

    .resource-name {
      font-size: 14px;
      line-height: 18px;

      min-height: 36px;

      word-break: break-word;
    }

      margin-top: 5px;

      width: 100%;

      outline: none;

      padding: 0 9px;

      background: var(

      );

      color: var(

        #000000
      );

      font-size: 15px;

      -webkit-appearance: none;
    }

    .resource-input:focus {
      border-color: var(

    .saving {
      position: fixed;

      left: 50%;
      bottom: 18px;

      transform: translateX(-50%);

      background: var(
        --tg-theme-button-color,
        #2481cc

      color: var(
        --tg-theme-button-text-color,
        #ffffff
      );

      padding: 7px 13px;

      border-radius: 20px;

      font-size: 13px;
      font-weight: 500;

      opacity: 0;

      pointer-events: none;

      transition: opacity 0.2s ease;

      z-index: 100;
    }

    .saving.show {
      opacity: 1;

    .loading {
      text-align: center;

    }

    .error {

    @media (min-width: 600px) {
      .resources {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }

      body {
        max-width: 900px;
        margin: 0 auto;

  </style>
</head>

<body>

  <div class="header">
    <h1>🎒 Рюкзак</h1>
    <p>Твои ресурсы</p>
  </div>

  <div id="content">
    <div class="loading">
      Загрузка рюкзака...
    </div>
  </div>

  <div id="saving" class="saving">
    ✓ Сохранено
  </div>

  <script>

    /*
     * ================================
     * TELEGRAM
     * ================================
     */

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    /*
     * ================================
     * РЕСУРСЫ
     * ================================
     */

    const RESOURCES = [
      'Золото',
      'Карты героев SSR-ранга',
      'Самовыбор книг опыта бойца',
      'Самовыбор рун дракона',
      'Самовыбор строительства замка',
      'Идеальное заклинание призыва',
      'Продвинутое заклинание призыва',
      'Кровь титана',
      'Флакон стихий',
      'Зелье удачи',
      'Укрепляющее зелье',
      'Элитный камень души дракона',
      'Камень души дракона',
      'Камень',
      'Кузнечный молот',
      'Идеальное заклинание призыва (переработано)',
      'Продвинутое заклинание призыва (переработано)',
      'Элитный камень души дракона (переработано)',
      'Камень души дракона (переработано)',
      'Кровь титана (переработано)',
      'Флакон стихий (переработано)',
      'Дерево',
      'Сталь',

      'Книга опыта лучниц 1-го ранга',
      'Книга опыта лучниц 2-го ранга',
      'Книга опыта лучниц 3-го ранга',
      'Книга опыта лучниц 4-го ранга',

      'Книга опыта огненных магов 1-го ранга',
      'Книга опыта огненных магов 2-го ранга',
      'Книга опыта огненных магов 3-го ранга',
      'Книга опыта огненных магов 4-го ранга',

      'Книга опыта ледяных колдуний 1-го ранга',
      'Книга опыта ледяных колдуний 2-го ранга',
      'Книга опыта ледяных колдуний 3-го ранга',
      'Книга опыта ледяных колдуний 4-го ранга',

      'Книга опыта гоблинов 1-го ранга',
      'Книга опыта гоблинов 2-го ранга',
      'Книга опыта гоблинов 3-го ранга',
      'Книга опыта гоблинов 4-го ранга',

      'Эпическая руна дракона',
      'Идеальная руна дракона',
      'Отличная руна дракона',
      'Редкая руна дракона',

      'Книга Мастера Таланты',
      'Корона оракула',
      'Осколок галереи',
      'Реагент света'
    ];


    /*
     * ================================
     * ИКОНКИ
     * ================================
     */

    const ICONS = {
      'Золото': '🪙',
      'Карты героев SSR-ранга': '🃏',
      'Камень': '🪨',
      'Дерево': '🪵',
      'Сталь': '⚙️',
      'Кузнечный молот': '🔨',
      'Кровь титана': '🩸',
      'Флакон стихий': '🧪',
      'Зелье удачи': '🍀',
      'Укрепляющее зелье': '💪',
      'Корона оракула': '👑',
      'Осколок галереи': '💎',
      'Реагент света': '✨'
    };


    /*
     * ================================
     * ДАННЫЕ
     * ================================
     */

    let backpack = {};


    /*
     * ================================
     * ПОЛУЧЕНИЕ TOKEN
     * ================================
     */

    const urlParams =
      new URLSearchParams(
        window.location.search
      );

    const token =
      urlParams.get('token') || '';


    /*
     * ================================
     * ЗАГРУЗКА
     * ================================
     *
     * Пока используем пустой рюкзак.
     * Подключение к Apps Script сделаем
     * следующим шагом.
     */

    function loadBackpack() {

      RESOURCES.forEach(
        resource => {
          backpack[resource] = 0;
        }
      );

      renderBackpack();
    }


    /*
     * ================================
     * ОТОБРАЖЕНИЕ
     * ================================
     */

    function renderBackpack() {

      const content =
        document.getElementById(
          'content'
        );

      content.innerHTML = '';

      const grid =
        document.createElement('div');

      grid.className =
        'resources';


      RESOURCES.forEach(
        (resource, index) => {

          const card =
            document.createElement(
              'div'
            );

          card.className =
            'resource-card';


          const icon =
            document.createElement(
              'div'
            );

          icon.className =
            'resource-icon';

          icon.textContent =
            getIcon(resource);


          const name =
            document.createElement(
              'div'
            );

          name.className =
            'resource-name';

          name.textContent =
            resource;


          const value =
            document.createElement(
              'div'
            );

          value.className =
            'resource-value';

          value.textContent =
            'Количество: ' +
            formatNumber(
              backpack[resource] || 0
            );


          const input =
            document.createElement(
              'input'
            );

          input.className =
            'resource-input';

          input.type =
            'number';

          input.min =
            '0';

          input.step =
            '1';

          input.inputMode =
            'numeric';

          input.value =
            backpack[resource] || 0;

          input.dataset.resource =
            resource;


          /*
           * Сохраняем сразу после изменения.
           */

          input.addEventListener(
            'change',
            function() {

              saveResource(
                resource,
                input.value,
                value,
                input
              );

            }
          );


          /*
           * Также сохраняем после Enter.
           */

          input.addEventListener(
            'keydown',
            function(event) {

              if (
                event.key === 'Enter'
              ) {

                input.blur();

              }

            }
          );


          card.appendChild(icon);
          card.appendChild(name);
          card.appendChild(value);
          card.appendChild(input);

          grid.appendChild(card);

        }
      );


      content.appendChild(grid);

    }


    /*
     * ================================
     * ИКОНКА
     * ================================
     */

    function getIcon(resource) {

      if (ICONS[resource]) {
        return ICONS[resource];
      }

      if (
        resource.includes('Книга')
      ) {
        return '📕';
      }

      if (
        resource.includes('руна')
      ) {
        return '🔮';
      }

      if (
        resource.includes('заклинание')
      ) {
        return '✨';
      }

      if (
        resource.includes('камень')
      ) {
        return '💎';
      }

      if (
        resource.includes('души')
      ) {
        return '💠';
      }

      return '📦';

    }


    /*
     * ================================
     * СОХРАНЕНИЕ
     * ================================
     */

    function saveResource(
      resource,
      value,
      valueElement,
      input
    ) {

      let amount =
        Number(value);

      if (
        !Number.isInteger(amount) ||
        amount < 0
      ) {

        input.value =
          backpack[resource] || 0;

        return;

      }


      backpack[resource] =
        amount;


      valueElement.textContent =
        'Количество: ' +
        formatNumber(amount);


      /*
       * Пока сохраняем локально.
       *
       * Когда подключим Apps Script,
       * здесь будет отправка данных
       * на сервер.
       */

      localStorage.setItem(
        'duel_backpack',
        JSON.stringify(
          backpack
        )
      );


      showSaved();

    }


    /*
     * ================================
     * УВЕДОМЛЕНИЕ
     * ================================
     */

    let saveTimer = null;

    function showSaved() {

      const element =
        document.getElementById(
          'saving'
        );

      element.classList.add(
        'show'
      );


      clearTimeout(
        saveTimer
      );


      saveTimer =
        setTimeout(
          function() {

            element.classList.remove(
              'show'
            );

          },
          1000
        );

    }


    /*
     * ================================
     * ФОРМАТ ЧИСЕЛ
     * ================================
     */

    function formatNumber(number) {

      return Number(number)
        .toLocaleString('ru-RU');

    }


    /*
     * ================================
     * СТАРТ
     * ================================
     */

    loadBackpack();

  </script>

</body>
</html>
