<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Рюкзак</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f2f2f7;
      color: #111;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      margin: 5px 0 5px;
      font-size: 28px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 20px;
    }

    .resource {
      background: white;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .resource-name {
      font-size: 15px;
      flex: 1;
    }

    .amount {
      width: 100px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      text-align: right;
    }

    .save {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      background: #2481cc;
      color: white;
      font-size: 17px;
      font-weight: bold;
      margin: 10px 0 20px;
    }

    .status {
      text-align: center;
      color: #777;
      margin-bottom: 15px;
    }

    .error {
      color: #d33;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎒 Рюкзак</h1>

  <div class="subtitle">
    Изменения сохраняются автоматически
  </div>

  <div id="status" class="status">
    Загрузка...
  </div>

  <div id="resources"></div>

  <button class="save" onclick="saveBackpack()">
    💾 Сохранить
  </button>

</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const API_URL =
  'https://script.google.com/macros/s/AKfycbzeyP7PEDkUcVy5nSBPN78UNhzqB9PShdKwWFG7F2QQo0EAO-AwrH1zKoNll7i_EBM/exec';

const params = new URLSearchParams(window.location.search);
const token = params.get('token');

let backpack = {};

async function loadBackpack() {

  if (!token) {
    showError('Не найден ключ доступа.<br>Открой рюкзак через кнопку в боте.');
    return;
  }

  try {

    const url =
      API_URL +
      '?action=getBackpack&token=' +
      encodeURIComponent(token);

    const response = await fetch(url);

    const data = await response.json();

    if (data.error) {
      showError(data.error);
      return;
    }

    backpack = data;

    renderBackpack();

    document.getElementById('status').textContent =
      'Данные загружены';

  } catch (error) {

    showError(
      'Не удалось загрузить рюкзак.<br>' +
      error.message
    );

  }
}

function renderBackpack() {

  const container =
    document.getElementById('resources');

  container.innerHTML = '';

  Object.keys(backpack).forEach(function(resource) {

    const row =
      document.createElement('div');

    row.className = 'resource';

    row.innerHTML = `
      <div class="resource-name">
        ${escapeHtml(resource)}
      </div>

      <input
        class="amount"
        type="number"
        min="0"
        value="${backpack[resource] || 0}"
        data-resource="${escapeHtml(resource)}"
      >
    `;

    container.appendChild(row);

  });

}

async function saveBackpack() {

  const inputs =
    document.querySelectorAll('.amount');

  const status =
    document.getElementById('status');

  status.textContent =
    'Сохранение...';

  try {

    for (const input of inputs) {

      const resource =
        input.dataset.resource;

      const amount =
        Number(input.value);

      const url =
        API_URL +
        '?action=saveResource' +
        '&token=' +
        encodeURIComponent(token) +
        '&resource=' +
        encodeURIComponent(resource) +
        '&amount=' +
        encodeURIComponent(amount);

      const response =
        await fetch(url);

      const result =
        await response.json();

      if (result.error) {
        throw new Error(result.error);
      }

      backpack[resource] =
        amount;
    }

    status.textContent =
      '✅ Сохранено';

  } catch (error) {

    status.textContent =
      '❌ Ошибка сохранения';

    alert(error.message);

  }

}

function showError(message) {

  document.getElementById('status').innerHTML =
    '<div class="error">' +
    message +
    '</div>';

  document.getElementById('resources').innerHTML =
    '';

}

function escapeHtml(text) {

  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}

loadBackpack();

</script>

</body>
</html>
